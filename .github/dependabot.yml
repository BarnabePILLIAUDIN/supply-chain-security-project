# Hygiène supply-chain de NOTRE propre chaîne : les GitHub Actions et les dépendances Python
# sont elles-mêmes des dépendances tierces (cf. menace T2 du threat model — runner/CI compromis).
# Dependabot ouvre des PR de mise à jour, à revoir avant merge.
version: 2
updates:
  # Les actions référencées dans .github/workflows/*.yml
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(actions)"

  # Dépendances de l'application (Flask, gunicorn, prometheus-client)
  - package-ecosystem: pip
    directory: /app
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(app)"
